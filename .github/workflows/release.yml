# An annotated `v*` tag publishes a release: the same checks as CI, a
# ReleaseSafe build with the Metal backend, one binary tarball and one source
# tarball, a `SHA256SUMS` that covers both, and a build provenance
# attestation for each tarball (`gh attestation verify`). The release is
# created as a draft with every asset attached and published last, so a
# failed upload never leaves a public release missing files.
#
# The tag is the trigger and `build.zig.zon` is the truth: the job refuses a
# malformed tag, a lightweight tag, a tag that disagrees with the manifest,
# or a tag already published, all before it builds anything. The notes are
# the tag's message (the release's highlights), GitHub's generated list of
# the pull requests merged since the previous release, and
# `.github/release-footer.md`. Dispatch re-runs it for a tag whose release
# is still a draft.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and publish
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is semver and the manifest agrees
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "refusing to publish: $tag is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          manifest=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          echo "tag $tag, manifest $manifest"
          if [ "$tag" != "v$manifest" ]; then
            echo "refusing to publish: the tag says $tag and build.zig.zon says $manifest" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The tag's manifest picks the Zig version; the installer and extra
      # digests come from the workflow's own revision, so a tag cut before
      # its compiler was pinned, or with a broken installer, can still be
      # published by dispatch. The source archive is `git archive` of the
      # tag, untouched by these edits.
      - name: Install the pinned Zig
        run: |
          git show "${{ github.sha }}:.github/install-zig.sh" > .github/install-zig.sh
          git show "${{ github.sha }}:.github/zig-toolchain" >> .github/zig-toolchain
          ./.github/install-zig.sh "$HOME/.local/zig"

      - run: echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: The compiler is the manifest's
        run: |
          manifest=$(sed -n 's/.*\.minimum_zig_version = "\([^"]*\)".*/\1/p' build.zig.zon)
          installed=$(zig version)
          echo "manifest $manifest, installed $installed"
          [ "$manifest" = "$installed" ] || {
            echo "refusing to publish: toolchain $installed != minimum_zig_version $manifest" >&2
            exit 1
          }

      - name: The gate, minus what needs a GPU or a model
        run: |
          zig fmt --check build.zig build.zig.zon src/ inference/ huggingface/
          zig build test --summary all

      - name: The notes exist before anything is built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          mkdir -p dist
          # The tag object itself, not a lightweight copy of it.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo "refusing to publish: $tag is a lightweight tag; its message is the release's highlights (git tag -a)" >&2
            exit 1
          fi
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$tag" > dist/highlights.md
          if [ -z "$(tr -d '[:space:]' < dist/highlights.md)" ]; then
            echo "refusing to publish: $tag has an empty message" >&2
            exit 1
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "refusing to publish: $tag is already published; a tag never moves, the fix is the next version" >&2
            exit 1
          fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$tag" --jq .body > dist/generated.md
          { cat dist/highlights.md; echo; cat dist/generated.md; echo; cat .github/release-footer.md; } > dist/notes.md
          cat dist/notes.md

      - name: Build
        run: zig build -Dmetal=true -Doptimize=ReleaseSafe

      - name: Package
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          name="nuclis-$tag-aarch64-macos"
          mkdir -p "dist/$name"
          cp zig-out/bin/nuclis "dist/$name/"
          cp README.md THIRD_PARTY_NOTICES.md CHANGELOG.md "dist/$name/"
          # A licence is the owner's decision, not this workflow's: ship one
          # when the tree has one, and say so plainly when it does not rather
          # than failing the release over a file that was never written.
          if [ -f LICENSE ]; then
            cp LICENSE "dist/$name/"
          else
            echo "::warning::no LICENSE file in the tree; the archive ships without one"
          fi
          # The binary must report the version it is released as. It prints
          # its own name too (`nuclis X.Y.Z`), so compare the full string.
          reported=$(./zig-out/bin/nuclis --version)
          [ "$reported" = "nuclis $version" ] || {
            echo "refusing to publish: the binary reports $reported, not nuclis $version" >&2
            exit 1
          }
          # Both archives are rooted in their own directory so unpacking is
          # always additive.
          ( cd dist && tar -czf "$name.tar.gz" "$name" )
          git archive --format=tar.gz --prefix="nuclis-$tag-src/" \
            -o "dist/nuclis-$tag-src.tar.gz" "$tag"
          # One digest file covers both, so `shasum -a 256 -c SHA256SUMS` works
          # in whatever directory it was downloaded to.
          ( cd dist && shasum -a 256 ./*.tar.gz > SHA256SUMS && cat SHA256SUMS )
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Attest the tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release is one whose version carries a suffix — 0.2.0-rc1,
          # 0.3.0-dev. A 0.x release is not a pre-release, it is an early
          # one, and marking it as such hides it from the repository sidebar,
          # which only ever shows the latest *full* release.
          case "${{ steps.version.outputs.version }}" in
            *-*) kind="--prerelease" ;;
            *) kind="--latest" ;;
          esac
          tag="${{ steps.version.outputs.tag }}"
          assets_files="dist/nuclis-$tag-aarch64-macos.tar.gz dist/nuclis-$tag-src.tar.gz dist/SHA256SUMS"
          if gh release view "$tag" > /dev/null 2>&1; then
            # A dispatch re-run: the draft gets fresh assets and notes.
            gh release upload "$tag" --clobber $assets_files
            gh release edit "$tag" --title "nuclis $tag" --notes-file dist/notes.md
          else
            gh release create "$tag" --draft --verify-tag \
              --title "nuclis $tag" --notes-file dist/notes.md $kind $assets_files
          fi
          assets=$(gh release view "$tag" --json assets --jq '.assets | length')
          [ "$assets" = 3 ] || {
            echo "refusing to publish: the draft has $assets assets, not 3" >&2
            exit 1
          }
          gh release edit "$tag" --draft=false $kind
