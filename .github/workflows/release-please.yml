# Every push to main updates the standing release PR: the next version from
# the Conventional Commit titles since the last tag (`bump-minor-pre-major`,
# so a breaking change bumps the minor while 0.x), its CHANGELOG section, and
# the version in the three build.zig.zon files (`release-please-config.json`).
# Merging that PR is the release: release-please tags it and opens a draft
# GitHub release with the section as its notes, and `release.yml`, called
# here, builds, attests, uploads, and publishes it. A tag made with
# GITHUB_TOKEN starts no workflow by itself, which is why the call is here
# and not on `push: tags`.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
