# Every push and pull request: the checks that need nothing but a compiler.
#
# What runs here is exactly what `make check` runs minus the GPU: the format
# check, the default unit tests (no model, no network, no GPU), a build with
# the Metal backend so the Objective-C bridge and the framework links are
# covered, and a CPU-only build so the `error.MetalNotEnabled` path keeps
# linking. What does *not* run here, deliberately: `test-metal`, `compare`,
# `bench`, and anything that pulls a model. Those need the pinned 16.5 GB
# artifact and the real M4 Pro; a number measured on a virtualised GPU would
# be a number nobody should trust, and their evidence belongs in
# docs/reference/engineering-log.md.
#
# The compiler is installed by `.github/install-zig.sh`: the version comes from
# `minimum_zig_version` in build.zig.zon and the SHA-256 from
# `.github/zig-toolchain`, both verified before anything is unpacked. No
# marketplace action installs it — this repository pins a digest for every
# artifact it downloads, and the compiler is the one it cannot do without. The
# actions it does use are pinned by full commit SHA, not a moving tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Cache the toolchain
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/zig
            ~/.cache/zig
          key: zig-${{ hashFiles('build.zig.zon', '.github/zig-toolchain') }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the pinned Zig
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./.github/install-zig.sh "$HOME/.local/zig"

      - run: echo "$HOME/.local/zig" >> "$GITHUB_PATH"
      - run: zig version

      - name: Format
        run: zig fmt --check build.zig build.zig.zon src/ inference/ huggingface/

      - name: The manifest version is semver
        run: |
          version=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "build.zig.zon .version '$version' is not MAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          }
          echo "version $version"

      - name: Unit tests
        run: zig build test --summary all

      - name: Metal build
        run: zig build -Dmetal=true -Doptimize=ReleaseSafe

      - name: The binary answers for itself
        run: |
          ./zig-out/bin/nuclis --version
          ./zig-out/bin/nuclis --help > /dev/null
          ./zig-out/bin/nuclis agent --help > /dev/null

      - name: CPU-only build links without the Metal bridge
        run: |
          zig build -Dmetal=false -Doptimize=ReleaseSafe
          ./zig-out/bin/nuclis --version
